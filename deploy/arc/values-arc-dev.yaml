# Helm values for the arc-dev runner scale set (agent factory). Apply with:
#   deploy/arc/install.sh   (see README.md)
minRunners: 0
# Parallel factory runs (one per issue). Each runner requests 2 CPU and 4 GiB.
maxRunners: 3
template:
  spec:
    # The image is imported into each k3s node's containerd (no registry):
    #   deploy/arc/build-image.sh 1 redjhawk@malaga   (build here, import over SSH; see README.md)
    containers:
      - name: runner
        image: docker.io/library/arc-runner-dev:1
        imagePullPolicy: Never
        command: ["/home/runner/run.sh"]
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {memory: 8Gi}
