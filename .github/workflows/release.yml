# Compilación y release: al fusionar en master, con el GITHUB_TOKEN temporal.
name: release
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  compilar:
    runs-on: arc-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version: stable}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Instalar gh si falta
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            v=2.103.3
            case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            curl -fsSL "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_${arch}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          fi
      # build-release.sh compila el frontend y lo embebe en el binario (CGO_ENABLED=0, linux/amd64)
      - run: npm ci
      # Una sola etiqueta para el binario (versión mostrada en la app) y para la release
      - name: Calcular la etiqueta de la release
        run: echo "RELEASE_TAG=v$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
      - run: ./scripts/build-release.sh amd64
        env:
          PRICEFOLLOWER_VERSION: ${{ env.RELEASE_TAG }}
      - run: cp release/pricefollower pricefollower-linux-amd64
      - run: sha256sum pricefollower-linux-amd64 > pricefollower-linux-amd64.sha256
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" pricefollower-linux-amd64 pricefollower-linux-amd64.sha256 --target "$GITHUB_SHA" --notes "Compilación automática"
