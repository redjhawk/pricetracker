# Copy to pricetracker/.github/workflows/ai-dev.yml
# AI developer: an issue labelled "ai-dev" (or an "@claude" comment) makes Claude implement it on a
# branch, following AGENTS.md and the project skills/roles. You review and merge the PR; merging to
# main triggers ci-deploy. Runs on the dev runner on barcelona (no deploy key there).
name: ai-dev

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ai-dev-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only the owner may trigger work on barcelona and use the Claude subscription.
    if: >-
      github.repository == 'redjhawk/pricetracker' &&
      github.actor == 'redjhawk' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: [self-hosted, barcelona-dev]
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          npm ci
          go mod download

      # The Claude token lives on barcelona (k8s Secret -> runner pod env), not in GitHub
      - name: Load Claude token from barcelona
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on the runner; run scripts/create-secrets.sh on barcelona"
            exit 1
          fi
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          echo "CLAUDE_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription token from `claude setup-token`: runs use Claude Pro/Max, not the API
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          label_trigger: ai-dev
          trigger_phrase: "@claude"
          branch_prefix: ai-dev/
          claude_args: |
            --model claude-opus-5-5
            --effort low
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,TodoWrite,Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(npm ci),Bash(npm run build),Bash(npm run dev:*),Bash(npm run test:*),Bash(npx tsc:*),Bash(npx playwright test:*),Bash(go run:*),Bash(curl -s http://localhost:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Before any work, read AGENTS.md and follow it fully: read the four project skills it lists (.agents/skills/ and project-skills/) and run the staged workflow in doc/workflow/WORKFLOW.md, using a separate Task subagent for each role in .agents/roles/. The issue is the user's development request. When a product decision, API contract approval or refactoring decision is needed, ask it in the issue and stop; the user answers with an @claude comment. Use small Conventional Commits that end with 'Refs: #<issue number>'. For QA, start the app with npm run dev in the background and test it with Playwright (Chromium is installed); stop it when done."
