# Copy to pricetracker/.github/workflows/ai-dev.yml
# AI developer: an issue labelled "ai-dev" (or an "@claude" comment) makes Claude implement it on a
# branch, following AGENTS.md and the project skills/roles. After the PR review and triage leave no
# blocking comment, Claude merges the PRs itself and starts ci-deploy (GITHUB_TOKEN merges trigger no workflows). Runs on the dev runner on barcelona (no deploy key there).
name: ai-dev

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ai-dev-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only the owner may trigger work on barcelona and use the Claude subscription.
    if: >-
      github.repository == 'redjhawk/pricetracker' &&
      github.actor == 'redjhawk' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ai-dev')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: [self-hosted, barcelona-dev]
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Lets the stage 10 agent start ci-deploy after merging (GITHUB_TOKEN merges trigger no workflows)
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          npm ci
          go mod download

      # The Claude token lives on barcelona (k8s Secret -> runner pod env), not in GitHub
      - name: Load Claude token from barcelona
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on the runner; run scripts/create-secrets.sh on barcelona"
            exit 1
          fi
          echo "::add-mask::$CLAUDE_CODE_OAUTH_TOKEN"
          echo "CLAUDE_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN" >> "$GITHUB_ENV"

      # gh is baked into the dev image; install it for this job if the runner image predates that
      - name: Ensure GitHub CLI
        run: |
          if command -v gh >/dev/null; then gh --version | head -1; exit 0; fi
          version=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_amd64/bin" >> "$GITHUB_PATH"
          echo "::warning::gh was missing from the runner image; rebuild runner-dev (scripts/build-and-import.sh runner-dev)"

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          # Lets Claude run `gh pr create`; PRs opened with this token do not trigger other workflows
          GH_TOKEN: ${{ github.token }}
        with:
          # Subscription token from `claude setup-token`: runs use Claude Pro/Max, not the API
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          # Environment for Claude's own Bash commands (gh reads GH_TOKEN; job token has pull-requests: write)
          settings: |
            {"env": {"GH_TOKEN": "${{ github.token }}"}}
          label_trigger: ai-dev
          trigger_phrase: "@claude"
          branch_prefix: ai-dev/
          claude_args: |
            --model claude-opus-5-5
            --effort low
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,TodoWrite,Bash(go build:*),Bash(go test:*),Bash(go vet:*),Bash(gofmt:*),Bash(npm ci),Bash(npm run build),Bash(npm run dev:*),Bash(npm run test:*),Bash(npx tsc:*),Bash(npx playwright:*),Bash(node:*),Bash(./pricefollower:*),Bash(bash -n:*),Bash(date -u:*),Bash(pkill -f pricefollower*),Bash(pkill -f vite*),Bash(go run:*),Bash(PRICEFOLLOWER_ENV=development go run:*),Bash(env PRICEFOLLOWER_ENV=development go run:*),Bash(curl http://localhost*),Bash(curl -s http://localhost*),Bash(curl http://127.0.0.1*),Bash(curl -s http://127.0.0.1*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git branch --show-current),Bash(git branch --list:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout -b ai-dev/*),Bash(git switch -c ai-dev/*),Bash(git switch ai-dev/*),Bash(git push origin HEAD),Bash(git push -u origin HEAD),Bash(git push --force-with-lease origin HEAD),Bash(git fetch origin:*),Bash(git checkout ai-dev/*),Bash(git restore:*),Bash(git rm:*),Bash(git mv:*),Bash(git stash:*),Bash(git cherry-pick:*),Bash(git rebase:*),Bash(git reset:*),Bash(git merge-base:*),Bash(git branch ai-dev/*),Bash(git branch -m ai-dev/*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh api repos/redjhawk/pricetracker/pulls/*/reviews --method POST --input *),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh pr merge * --merge --delete-branch),Bash(gh api repos/redjhawk/pricetracker/pulls/* --method PATCH -f base=*),Bash(gh pr merge * --squash --delete-branch),Bash(gh workflow run ci-deploy.yml --ref master)"
            --append-system-prompt "Before any work, read AGENTS.md and follow it fully: read the four project skills it lists (.agents/skills/ and project-skills/) and run the staged workflow in doc/workflow/WORKFLOW.md, using a separate Task subagent for each role in .agents/roles/. The issue is the user's development request. When a product decision, API contract approval or refactoring decision is needed, ask it in the issue and stop; the user answers with an @claude comment. Use small Conventional Commits that end with 'Refs: #<issue number>'. Publish a branch only with exactly `git push -u origin HEAD`. Open pull requests yourself with `gh pr create`, titled 'ai-dev #<issue number>: <what this PR does>', with a body that explains the change and links the issue ('Closes #<n>' on the PR that merges into master, 'Part of #<n>' on the others). For a big refactoring or a large feature, split the work into several reviewable PRs on a feature branch: first run `git fetch origin master` and `git checkout -b ai-dev/issue-<n>-feature origin/master` (an exact copy of master, before any run commit) and push it; create each part branch with `git checkout -b ai-dev/issue-<n>-<short-name>`; PR 1 uses `--base ai-dev/issue-<n>-feature`, and each later part branches from the previous part and passes `--base <that branch>`, saying so in its body; do not open the final PR from `ai-dev/issue-<n>-feature` to master now (GitHub refuses it while the feature branch equals master); it is created only after every part has merged into the feature branch, lists the parts in merge order, and is the only merge that deploys. A change that fits one PR targets master directly. To split work that is already written, move it between ai-dev/ branches with cherry-pick, `git checkout ai-dev/<branch> -- <paths>`, `git restore`, `git reset` and interactive-free rebases (`git rebase --onto`); after rebasing a branch that is already pushed, update it only with `git push --force-with-lease origin HEAD`, and keep each PR's base and description current with `gh pr edit`. Every part must build and pass its tests on its own. Only branches named ai-dev/... may be created or pushed. After review decisions, post the adjudicator's decision summary on the issue with `gh issue comment <n>`; it is informational, so do not stop for a reply. Name the change folder doc/changes/<YYYY-MM-DD-HHMM>-issue-<n>-<slug>, using the UTC time at which this run started the change (`date -u +%Y-%m-%d-%H%M`). After opening the PRs, run the PR reviewer (.agents/roles/pr-reviewer.md) as a separate Task subagent: it posts one GitHub review per PR with `gh api repos/redjhawk/pricetracker/pulls/<n>/reviews --method POST --input <file>` and only comments; possible bugs mean REQUEST_CHANGES (or a COMMENT review starting with CHANGES REQUESTED if GitHub refuses) and an issue comment listing them. After posting reviews, commit doc/changes/<change>/pr-review.md (with each PR's reviewed head SHA) to the last PR branch with Refs: #<n> and push it; do the same for pr-triage.md after triage, and before the first merge commit and push pr-triage.md with its planned merge order (nothing is committed after merges start); a commit that only adds or updates pr-review.md, pr-triage.md or todo files needs no re-review. Then run the triage agent (.agents/roles/pr-review-triage.md) as a separate Task subagent. Non-blocking comments become doc/todo/<YYYY-MM-DD>-<slug>.md files committed on the PR branch, plus a `gh issue create` issue; if creating the issue fails, report it and continue. Blocking comments go back to the developer subagent: fix, push, run the PR reviewer again, triage again, and repeat until none block (after 5 rounds, report to the user and stop). When nothing blocks, merge the PRs in stack order (for each part, first retarget the next part with `gh api repos/redjhawk/pricetracker/pulls/<next> --method PATCH -f base=<feature branch>` (GitHub closes a PR whose base branch is deleted), then `gh pr merge <n> --merge --delete-branch`; after all parts merge, check with `git merge-base --is-ancestor` that every part is in the feature branch; for a split change then create the final PR with `gh pr create --base master --head ai-dev/issue-<n>-feature` and body 'Closes #<n>' listing the parts; then the final or single PR with `gh pr merge <n> --squash --delete-branch`; if a merge fails, report it and stop), then run `gh workflow run ci-deploy.yml --ref master`, and report the merge results and deploy run only on the issue with `gh issue comment` and in the final run report. After pushing @claude fixes to a PR, run the PR reviewer and the triage again on that PR. For QA, start the app with npm run dev in the background and test it with Playwright (Chromium is installed); stop it when done."

      # Safety net: Claude normally opens its PRs itself (possibly several). If it committed on the
      # run's branch but left it without a PR, open one. Skipped for PR comments (the PR exists) and
      # when the branch has no commits (e.g. Claude stopped to ask a question).
      - name: Open pull request
        if: steps.claude.outputs.branch_name != '' && github.event.issue && !github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          base="${{ github.event.repository.default_branch }}"
          closing="Closes #$ISSUE_NUMBER"
          # A split run keeps master untouched until its final feature-branch PR: target the feature branch instead
          feature="ai-dev/issue-$ISSUE_NUMBER-feature"
          if [ "$BRANCH" != "$feature" ] && api "$repo_api/branches/$feature" >/dev/null 2>&1; then
            base="$feature"
            closing="Part of #$ISSUE_NUMBER"
          fi

          ahead=$(api "$repo_api/compare/$base...$BRANCH" | jq -r .ahead_by 2>/dev/null || echo 0)
          if [ "${ahead:-0}" = 0 ]; then
            echo "No commits on $BRANCH yet; not opening a PR."
            exit 0
          fi

          existing=$(api "$repo_api/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:$BRANCH" | jq -r '.[0].html_url // empty')
          if [ -n "$existing" ]; then
            echo "PR already open: $existing"
            exit 0
          fi

          url=$(jq -n --arg title "ai-dev #$ISSUE_NUMBER: $ISSUE_TITLE" --arg head "$BRANCH" --arg base "$base" \
                  --arg body "Implemented by Claude (ai-dev workflow) for #$ISSUE_NUMBER.

          $closing" '{title: $title, head: $head, base: $base, body: $body}' \
                | api -X POST "$repo_api/pulls" -d @- | jq -r .html_url)
          echo "Opened $url"
          echo "### Pull request: $url" >> "$GITHUB_STEP_SUMMARY"

      # Enforces the PR size limit from AGENTS.md: fails the run if any open PR for this issue has more
      # than 500 changed lines, not counting generated files. The final feature-branch PR (ai-dev/issue-<n>-feature
      # into master) is exempt: it only aggregates part PRs that were already measured.
      - name: Check pull request sizes
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          # On PR comments the event number is the PR's, so take the issue from the ai-dev/issue-<n>- branch
          BRANCH: ${{ steps.claude.outputs.branch_name || github.event.pull_request.head.ref }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          LIMIT: 500
        run: |
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          repo_api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          generated='^(package-lock\.json|go\.sum|dist/.*|test-results/.*|playwright-report/.*)$'
          ISSUE_NUMBER=$(sed -n 's#^ai-dev/issue-\([0-9]*\)-.*#\1#p' <<<"$BRANCH")
          ISSUE_NUMBER="${ISSUE_NUMBER:-$EVENT_NUMBER}"
          failed=0
          for pr in $(api "$repo_api/pulls?state=open&per_page=100" \
                        | jq -r --arg n "$ISSUE_NUMBER" '.[] | select(.head.ref | startswith("ai-dev/issue-\($n)-")) | select(.head.ref != "ai-dev/issue-\($n)-feature") | .number'); do
            lines=$(api "$repo_api/pulls/$pr/files?per_page=100" \
                      | jq --arg gen "$generated" '[.[] | select(.filename | test($gen) | not) | .additions + .deletions] | add // 0')
            echo "PR #$pr: $lines changed lines (limit $LIMIT)"
            if [ "$lines" -gt "$LIMIT" ]; then
              echo "::error::PR #$pr has $lines changed lines; split it into stacked PRs of at most $LIMIT"
              failed=1
            fi
          done
          exit $failed
