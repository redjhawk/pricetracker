# Revisión de seguridad y fusión: se lanza cuando terminan las pruebas y usa el workflow de master,
# así que un PR no puede cambiar la lógica del revisor. El código del PR solo se lee, nunca se ejecuta.
# Los PR de forks nunca se fusionan solos.
name: revision-seguridad
on:
  workflow_run:
    workflows: [pruebas]
    types: [completed]
permissions:
  contents: read
jobs:
  revisar:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: arc-review
    environment: revision
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with: {go-version: stable}
      - name: Instalar gh si falta
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            v=2.103.3
            case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
            curl -fsSL "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_${arch}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${v}_linux_${arch}/bin" >> "$GITHUB_PATH"
          fi
      - name: Localizar el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" --json number -q '.[0].number')
          # Los PR divididos apuntan a la rama de la funcionalidad; el PR final, a master
          BASE=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          HEAD=$(gh pr view "$PR" --json headRefName -q .headRefName)
          { echo "PR=$PR"; echo "BASE=$BASE"; echo "HEAD=$HEAD"; } >> "$GITHUB_ENV"
          git fetch origin "pull/$PR/head:pr"
          git worktree add ../pr pr
      - name: Zonas sensibles (requieren revisión humana)
        run: |
          if git diff --name-only "origin/$BASE...pr" | grep -E '^(\.github/|CODEOWNERS|go\.(mod|sum))'; then
            echo "Cambios sensibles: no se fusiona automáticamente"; exit 1
          fi
      - name: Tamaño del PR (límite de AGENTS.md)
        run: |
          # El PR final de la rama de la funcionalidad solo agrega partes ya medidas
          if [ "$BASE" = master ] && [[ "$HEAD" == ai-dev/issue-*-feature ]]; then exit 0; fi
          # Script de master, nunca el del PR
          ./scripts/pr-size.sh "origin/$BASE" pr
      - name: Análisis determinista
        working-directory: ../pr
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
          "$(go env GOPATH)/bin/gosec" ./...
          # gitleaks desde su release oficial, con verificación de la suma SHA-256
          v=8.30.1
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=x64 ;; esac
          file="gitleaks_${v}_linux_${arch}.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$v/$file"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks
          cd "$GITHUB_WORKSPACE/../pr"
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="origin/$BASE..pr" .
      # La revisión del agente la hacen revision-pr y triage-pr antes de las pruebas: si este workflow
      # se ejecuta, el PR ya está aprobado sin comentarios bloqueantes.
      - name: Fusionar
        env:
          GH_TOKEN: ${{ secrets.MERGE_TOKEN }}
        run: |
          if [ "$BASE" = master ]; then
            gh pr merge "$PR" --squash
            exit 0
          fi
          # Parte de un cambio dividido: el PR siguiente apunta a esta rama; se reapunta a la rama de la
          # funcionalidad antes de fusionar (GitHub cierra un PR cuya base se borra)
          for next in $(gh pr list --base "$HEAD" --state open --json number -q '.[].number'); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$next" --method PATCH -f base="$BASE" >/dev/null
          done
          gh pr merge "$PR" --merge
          # Última parte fusionada: desarrollo abre el PR final (con DEV_TOKEN, para que triage-pr pueda aprobarlo)
          issue=$(sed -n 's#^ai-dev/issue-\([0-9]*\)-feature$#\1#p' <<<"$BASE")
          if [ -n "$issue" ] && [ -z "$(gh pr list --base "$BASE" --state open --json number -q '.[].number')" ]; then
            gh issue comment "$issue" --body "@claude Todas las partes están fusionadas en \`$BASE\`. Abre el PR final de \`$BASE\` a \`master\` con 'Closes #$issue', que liste las partes en orden de fusión."
          fi
