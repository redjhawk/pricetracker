# Copy to pricetracker/.github/workflows/ci-deploy.yml
# Runs on the deploy runner on barcelona (no Claude token there): test, build, then deploy to the
# target device. DEPLOY_HOST and DEPLOY_USER come from the runner-deploy Deployment in k3s.
name: ci-deploy

on:
  push:
    # pricetracker's default branch is master; main is kept in case it is renamed
    branches: [master, main]
  workflow_dispatch:
# No pull_request trigger: the repo is public and must never run fork code on barcelona.

concurrency:
  group: deploy-target
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-deploy:
    if: github.repository == 'redjhawk/pricetracker'
    runs-on: [self-hosted, barcelona-deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci
          go mod download

      - name: Go vet and tests
        run: |
          go vet ./...
          go test ./...

      - name: Frontend type-check and build
        run: npm run build

      - name: Check the target device is reachable
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST is not set on the runner (k3s runner-deploy env)}"
          : "${DEPLOY_USER:?DEPLOY_USER is not set on the runner (k3s runner-deploy env)}"
          getent hosts "$DEPLOY_HOST" || { echo "::error::Cannot resolve $DEPLOY_HOST from barcelona"; exit 1; }
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" true

      - name: Deploy to the target device
        run: ./scripts/deploy-armv6.sh "$DEPLOY_USER@$DEPLOY_HOST"
